name: Danger Swift Linux installer diagnosis
on:
  push:
    branches: [verify-danger-swift-installation]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Inspect official installer on native Swift
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/danger-diagnostic"
          set -o pipefail
          docker run --rm -v "$RUNNER_TEMP/danger-diagnostic:/work" -w /work swift:6.4.1-resolute bash -c '
            set -eu
            cat /etc/os-release
            swift --version
            git clone --depth 1 --branch 3.22.1 https://github.com/danger/swift.git danger
            cd danger
            PREFIX=/work/install bash Scripts/install.sh
            echo "=== installed files ==="
            find /work/install -maxdepth 4 -type f -print
            echo "=== build links ==="
            ls -la .build
            echo "=== build module and library locations ==="
            find .build -maxdepth 6 \( -name "*.swiftmodule" -o -name "libDanger.so" -o -name "Modules" -o -name "danger-swift" \) -print
            echo "=== manifest declaration ==="
            grep "library(name:.*Danger" Package.swift
          ' 2>&1 | tee "$RUNNER_TEMP/danger-diagnostic/diagnostic.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: danger-linux-installer-diagnostic
          path: ${{ runner.temp }}/danger-diagnostic/diagnostic.log
